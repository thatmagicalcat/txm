name: Release

on: 
  push:
    tags:
    - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: txm
            asset_name: txm-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: txm.exe
            asset_name: txm-windows-amd64.exe
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: txm
            asset_name: txm-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: txm
            asset_name: txm-macos-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: mv target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: Rename-Item -Path target\${{ matrix.target }}\release\${{ matrix.artifact_name }} -NewName ${{ matrix.asset_name }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
