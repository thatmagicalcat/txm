[package]
name = "txm-wasm"
version = "0.1.4"
edition = "2024"
description = "WebAssembly bindings for TXM, a terminal math rendering engine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/thatmagicalcat/txm"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
wasm-bindgen = "0.2"
libtxm = { package = "txm", path = "../..", default-features = false }
